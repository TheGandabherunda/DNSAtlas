name: Bug Report
description: Create a report to help us fix a bug or inconsistency in DNSAtlas
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details on what happened and steps to reproduce.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & Operating System
      placeholder: e.g. Chrome 120 on macOS Sonoma 14.2
    validations:
      required: true
